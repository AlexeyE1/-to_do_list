{% extends "base.html" %}

{% block container %}
    <div class="auth-buttons">
        <a href="#" class="register">Register</a>
        <a href="#" class="login">Login</a>
    </div>
    <div class="container">
        <h1>My To-Do List</h1>
        <form method="POST" action="" class="task-input">
            {% csrf_token %}
            <input type="text" name="task" placeholder="Add a new task..." id="taskInput">
            <button type="submit">Add</button>
        </form>
        <ul class="tasks" id="taskList">
            {% if tasks %}
                {% for task in tasks %}
                    <li>
                        <span>{{ task.text }}</span>
                        <form method="POST" action="#" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" class="remove">Remove</button>
                        </form>
                    </li>
                {% endfor %}
            {% else %}
                <li class="empty">No tasks yet!</li>
            {% endif %}
        </ul>
    </div>
{% endblock container %}
